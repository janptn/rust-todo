[package]
name = "rust-todo"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "=0.2.104"

[dependencies.web-sys]
version = "0.3.81"
features = [
  "Document",
  "Element",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlButtonElement",
  "Node",
  "Window",
  "Event",
  "KeyboardEvent",
  "Storage",
]

[profile.release]
opt-level = "s"
lto = true
